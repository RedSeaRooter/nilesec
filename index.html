<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilesec Academy | Offensive Operations</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        .code-font { font-family: 'JetBrains Mono', monospace; }
        body { background-color: #050811; color: #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="border-b border-blue-500/20 bg-black/40 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg bg-blue-500/10 border border-blue-500/40 flex items-center justify-center text-blue-400 font-bold code-font">NS</div>
            <div>
                <h1 class="text-white font-bold tracking-wider text-sm">NILESEC ACADEMY</h1>
                <p class="text-[10px] code-font text-blue-400">[ OFFENSIVE OPERATIONS V4.5 ]</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <a href="#courses" class="text-xs code-font text-gray-300 hover:text-blue-400 transition-all"><i class="fa-solid fa-shield-halved mr-1"></i>MISSIONS</a>
            <a href="admin.html" class="text-xs code-font text-gray-300 hover:text-blue-400 transition-all"><i class="fa-solid fa-user-shield mr-1"></i>COMMANDERS</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-6 py-10" id="courses">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-white tracking-wide mb-2"><i class="fa-solid fa-terminal text-blue-400 mr-2"></i>Active Operational Missions</h2>
            <p class="text-xs code-font text-gray-400">Select a verified training matrix to initialize tactical deployment.</p>
        </div>

        <div id="public-courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic content loaded securely via Firestore -->
            <div class="text-gray-500 code-font text-sm py-12 text-col col-span-full text-center">Establishing secure link to telemetry grid...</div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCxV...", 
            authDomain: "nilesec-404.firebaseapp.com",
            projectId: "nilesec-404",
            storageBucket: "nilesec-404.firebasestorage.app",
            messagingSenderId: "375678315238",
            appId: "1:375678315238:web:bd9516cf63e19682efe927"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const gridContainer = document.getElementById("public-courses-grid");

        // Secure real-time listener for public course data
        db.collection("courses").onSnapshot((snapshot) => {
            gridContainer.innerHTML = "";
            if(snapshot.empty) {
                gridContainer.innerHTML = `<p class="text-gray-500 code-font text-sm col-span-full text-center py-12">No active missions found in registry.</p>`;
                return;
            }
            snapshot.forEach((docSnap) => {
                const c = docSnap.data();
                const statusBadge = c.status === 'Open' 
                    ? `<span class="text-green-400 bg-green-500/15 border border-green-500/40 px-2.5 py-0.5 rounded-full text-[10px] code-font font-bold">OPERATIONAL</span>`
                    : `<span class="text-red-400 bg-red-500/15 border border-red-500/40 px-2.5 py-0.5 rounded-full text-[10px] code-font font-bold">LOCKED</span>`;

                gridContainer.innerHTML += `
                    <div class="bg-black/60 border border-blue-500/25 rounded-xl overflow-hidden flex flex-col justify-between transition-all hover:border-blue-400/50">
                        <div>
                            <div class="h-44 w-full bg-black border-b border-blue-500/20 overflow-hidden relative">
                                <img src="${escapeHtml(c.imageUrl || 'photo_2026-06-20_18-04-20.jpg')}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-5">
                                <div class="flex items-center justify-between gap-2 mb-2">
                                    <span class="text-xs code-font text-blue-400"><i class="fa-solid fa-clock mr-1"></i>${escapeHtml(c.duration || '10 Weeks')}</span>
                                    ${statusBadge}
                                </div>
                                <h3 class="text-white font-bold text-base mb-2">${escapeHtml(c.title)}</h3>
                                <p class="text-gray-400 text-xs leading-relaxed line-clamp-3">${escapeHtml(c.description)}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <button class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold code-font text-xs transition-all tracking-wider shadow-lg shadow-blue-600/20">ENROLL FOR THIS MISSION</button>
                        </div>
                    </div>
                `;
            });
        });

        // XSS Defense: Strict HTML Escaping Helper
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
